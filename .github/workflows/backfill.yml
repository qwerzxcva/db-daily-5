name: shard-backfill
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      batch: { description: "stocks per run", default: "120" }
permissions:
  contents: write
concurrency:
  group: backfill-shard
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyarrow
      - name: run
        run: python shard_worker.py 5 6 "${{ github.event.inputs.batch || '120' }}"
        env:
          SHARD_ID: ${{ vars.SHARD_ID }}
          TOTAL_SHARDS: ${{ vars.TOTAL_SHARDS }}
      - name: commit
        run: |
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "backfill $(date -u +%FT%TZ)" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
